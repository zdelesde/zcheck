# /etc/zcheck.conf - optional. One directive per line; '#' starts a comment.
#
# ---------------------------------------------------------------- scanning
# Defaults:
#   excluded:  /root /home /var /tmp /dev /sys /proc /run /net /mnt /media
#              /srv /lost+found, plus active swap files
#   included:  /root/.ssh /root/.bashrc /root/.profile /home/*/.ssh
#              /home/*/.bashrc /home/*/.profile /var/spool/cron
#   fstypes:   ext2 ext3 ext4 xfs btrfs zfs vfat f2fs jfs
# Other filesystems (proc, tmpfs, overlay, nfs, squashfs for snaps...) are
# recorded as one "M" entry each and not descended.
#
#   exclude PATH     don't descend into directory PATH / don't hash file PATH
#   unexclude PATH   remove one of the defaults above
#   include PATH     scan PATH although it's under an excluded directory (globs ok)
#   fstype TYPE      also descend into filesystems of TYPE
#   owners on|off    read dpkg ownership (default on)
#   verify on|off    compare files with package checksums (default on)

# Places attackers like to persist:
include /var/lib/dpkg/statoverride
# include /var/www/*/cgi-bin

# Host-specific data that changes constantly:
# exclude /opt/someapp/data

# ------------------------------------------------------------------- rules
# How `zcheck diff` and `zcheck audit` class what they find. First match wins,
# checked before the built-in logic. GLOB matches the whole path; "*" also
# matches "/". Note that /opt/* doesn't match /opt itself.
#
#   ignore GLOB      drop it
#   notice GLOB      class as notice
#   alarm GLOB       class as alarm
#   generated GLOB   diff: explained if any package changed, else alarm; audit: dropped

# Sanctioned unpackaged software: keep visible, but not alarming.
# notice /opt
# notice /opt/*

# Config that must only change through Ansible: escalate from notice.
# alarm /etc/ssh/sshd_config
# alarm /etc/sudoers
# alarm /etc/sudoers.d/*
